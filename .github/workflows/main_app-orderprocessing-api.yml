# Deployment is intentionally separate from the default CI path.
# It requires an active Azure subscription and the repository secrets documented in README.md.

name: Deploy API to Azure App Service

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.x'

      - name: Restore API dependencies
        run: dotnet restore OrderSystem.Api/OrderSystem.Api.csproj

      - name: Build API project
        run: dotnet build OrderSystem.Api/OrderSystem.Api.csproj --configuration Release --no-restore --nologo

      - name: Publish API project
        run: dotnet publish OrderSystem.Api/OrderSystem.Api.csproj --configuration Release --no-build --no-restore --output "${{ github.workspace }}/publish"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1861112AA32D45F7BE85621653E26FEE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_290B91DA23274F849A674FD3AB3319F0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_950A73BD0E19459AAD7BE1C719F43404 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'app-orderprocessing-api'
          slot-name: 'Production'
          package: .
